<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间进度条 · 世纪刻度</title>

    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 完整莫兰迪色系变量 */
        :root {
            --bg-color: #F2F2F2;
            /* 红色系 */
            --morandi-rose: #C9A9A6;
            --morandi-rust: #D7BEA8;
            --morandi-coral: #E0BFB8;
            --morandi-brick: #C19A6B;
            /* 蓝色系 */
            --morandi-azure: #A6BFD1;
            --morandi-slate: #8CA3AF;
            --morandi-denim: #7D8CA3;
            --morandi-water: #B4C7D6;
            /* 绿色系 */
            --morandi-sage: #A9B388;
            --morandi-moss: #94A684;
            --morandi-teal: #8FB996;
            --morandi-olive: #A4A786;
            /* 黄色系 */
            --morandi-cream: #E8DCCA;
            --morandi-sand: #D9C5B4;
            --morandi-sand-light: #F8F0E9;
            --morandi-honey: #D4C2AD;
            --morandi-straw: #E6D2AA;
            /* 紫色系 (世纪进度条复用农历月色调) */
            --morandi-lavender: #B8A9C9;
            --morandi-plum: #9E7C9F;
            --morandi-violet: #A18F9E;
            --morandi-iris: #9B82A7;
            /* 灰色系 */
            --morandi-greige: #B9B4C7;
            --morandi-ash: #A2AAB0;
            --morandi-stone: #B3ABA1;
            --morandi-smoke: #9DA2A6;
            /* 通用 */
            --white: #FFFFFF;
            --shadow-light: rgba(255, 255, 255, 0.7);
            --shadow-dark: rgba(150, 150, 150, 0.15);
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 1rem;
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: var(--morandi-slate);
            padding-top: 1rem;
        }

        .container {
            max-width: 28rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            padding-top: 0.1rem;
            padding-bottom: 2rem;
        }

        /* 返回按钮样式（视觉保留，未使用但无影响） */
        .back-btn {
            width: 3rem;
            height: 3rem;
            border-radius: 0.75rem;
            background-color: var(--white);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--morandi-slate);
            position: absolute;
            top: 2rem;
            left: 1rem;
        }

        .back-btn.neumorphic {
            box-shadow: 3px 3px 6px var(--shadow-dark),
                       -3px -3px 6px var(--shadow-light);
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: bold;
            margin-bottom: 2rem;
            color: var(--morandi-slate);
            text-align: center;
        }

        .content-area {
            width: 100%;
            max-width: 20rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        /* 进度卡片样式 */
        .progress-card {
            background-color: var(--morandi-sand-light);
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .progress-label {
            font-weight: 500;
            color: var(--morandi-slate);
        }

        .progress-percent {
            font-weight: bold;
            font-size: 1rem;
        }

        /* 进度条容器 */
        .progress-bar-container {
            width: 100%;
            height: 0.6rem;
            background-color: var(--white);
            border-radius: 0.4rem;
            overflow: hidden;
            position: relative;
        }

        /* 进度条填充 —— 首次加载动画：非线性缓动 */
        .progress-bar-fill {
            height: 100%;
            border-radius: 0.4rem;
            transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            width: 0%;
        }

        /* 原有进度条专属颜色 (1~6) */
        .p1 .progress-bar-fill { background-color: var(--morandi-azure); }
        .p1 .progress-percent { color: var(--morandi-azure); }

        .p2 .progress-bar-fill { background-color: var(--morandi-rose); }
        .p2 .progress-percent { color: var(--morandi-rose); }

        .p3 .progress-bar-fill { background-color: var(--morandi-sage); }
        .p3 .progress-percent { color: var(--morandi-sage); }

        .p4 .progress-bar-fill { background-color: var(--morandi-teal); }
        .p4 .progress-percent { color: var(--morandi-teal); }

        .p5 .progress-bar-fill { background-color: var(--morandi-denim); }
        .p5 .progress-percent { color: var(--morandi-denim); }

        .p6 .progress-bar-fill { background-color: var(--morandi-straw); }
        .p6 .progress-percent { color: var(--morandi-brick); }

        /* 世纪进度条 — 复用原农历月度的柔和紫色调 (p7) */
        .p7 .progress-bar-fill { background-color: var(--morandi-lavender); }
        .p7 .progress-percent { color: var(--morandi-plum); }

        /* 娱乐提示样式 */
        .disclaimer {
            font-size: 0.75rem;
            opacity: 0.5;
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 1rem;
            max-width: 20rem;
        }

        /* 轻拟态效果 */
        .neumorphic {
            box-shadow: 3px 3px 6px var(--shadow-dark),
                       -3px -3px 6px var(--shadow-light);
        }
    </style>
    <!-- 玻璃皮肤：统一覆盖层，须位于本页样式之后以便生效 -->
    <link rel="stylesheet" href="morandi.css">
    <script src="i18n.js"></script>
</head>
<body>

<div class="container">
    <div class="content-area">
        <!-- 1 本小时进度 -->
        <div class="progress-card p1 neumorphic">
            <div class="progress-header">
                <span class="progress-label">本小时进度</span>
                <span class="progress-percent" id="p1-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p1-bar"></div>
            </div>
        </div>

        <!-- 2 今日进度 -->
        <div class="progress-card p2 neumorphic">
            <div class="progress-header">
                <span class="progress-label">今日进度</span>
                <span class="progress-percent" id="p2-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p2-bar"></div>
            </div>
        </div>

        <!-- 3 本周进度 -->
        <div class="progress-card p3 neumorphic">
            <div class="progress-header">
                <span class="progress-label">本周进度</span>
                <span class="progress-percent" id="p3-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p3-bar"></div>
            </div>
        </div>

        <!-- 4 公历月度 -->
        <div class="progress-card p4 neumorphic">
            <div class="progress-header">
                <span class="progress-label">公历月度</span>
                <span class="progress-percent" id="p4-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p4-bar"></div>
            </div>
        </div>

        <!-- 5 本季度 -->
        <div class="progress-card p5 neumorphic">
            <div class="progress-header">
                <span class="progress-label">本季度进度</span>
                <span class="progress-percent" id="p5-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p5-bar"></div>
            </div>
        </div>

        <!-- 6 公历年度 -->
        <div class="progress-card p6 neumorphic">
            <div class="progress-header">
                <span class="progress-label">公历年度</span>
                <span class="progress-percent" id="p6-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p6-bar"></div>
            </div>
        </div>

        <!-- 7 世纪进度（新增，复用农历月色调） -->
        <div class="progress-card p7 neumorphic">
            <div class="progress-header">
                <span class="progress-label">本世纪进度</span>
                <span class="progress-percent" id="p7-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="p7-bar"></div>
            </div>
        </div>
    </div>

    <div class="disclaimer">本功能仅供参考</div>
</div>

<script>
    // ========================
    // 时间进度计算核心 (移除所有农历逻辑，新增世纪进度)
    // ========================

    let firstRender = true;

    /**
     * 计算本世纪进度 (基于当前世纪起始至下一世纪起始)
     * 例如 2000年1月1日 00:00:00 至 2100年1月1日 00:00:00
     * 返回 0～100 之间的浮点数
     */
    function calculateCenturyProgress(now) {
        const year = now.getFullYear();
        // 世纪起始年份: 向下取整到100的倍数 (2000, 1900, 2100...)
        const startCenturyYear = Math.floor(year / 100) * 100;
        // 世纪起始时刻: startCenturyYear年1月1日 00:00:00
        const centuryStart = new Date(startCenturyYear, 0, 1, 0, 0, 0, 0);
        // 下一世纪起始时刻: startCenturyYear + 100年 1月1日 00:00:00
        const centuryEnd = new Date(startCenturyYear + 100, 0, 1, 0, 0, 0, 0);

        const elapsed = now - centuryStart;
        const total = centuryEnd - centuryStart;
        if (total <= 0) return 0;
        let percent = (elapsed / total) * 100;
        return Math.min(100, Math.max(0, percent));
    }

    /**
     * 通用更新进度条函数
     * @param {number} id 进度条编号 1~7
     * @param {number} p 百分比 (0-100)
     */
    function updateProgress(id, p) {
        const val = Math.max(0, Math.min(100, p));
        const barEl = document.getElementById(`p${id}-bar`);
        const percentEl = document.getElementById(`p${id}-percent`);

        if (!barEl || !percentEl) return; // 安全保护

        percentEl.textContent = val.toFixed(1) + '%';

        if (firstRender) {
            // 首次加载：错开动画，更优雅 (保留原有趣味延迟)
            setTimeout(() => {
                if (barEl) barEl.style.width = val + '%';
            }, 100 + id * 70);
        } else {
            barEl.style.width = val + '%';
        }
    }

    /**
     * 更新所有进度条 (本小时、今日、本周、公历月度、季度、公历年度、世纪)
     */
    function updateAllProgress() {
        const now = new Date();

        // 1. 本小时进度
        const startHour = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0);
        const nextHour = new Date(startHour.getTime() + 3600000);
        const hourPercent = ((now - startHour) / (nextHour - startHour)) * 100;
        updateProgress(1, hourPercent);

        // 2. 今日进度
        const startDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        const nextDay = new Date(startDay.getTime() + 86400000);
        const dayPercent = ((now - startDay) / (nextDay - startDay)) * 100;
        updateProgress(2, dayPercent);

        // 3. 本周进度 (周一为一周开始，周日结束)
        const dayOfWeek = now.getDay();     // 0=周日, 1=周一...
        const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        const startWeek = new Date(now);
        startWeek.setDate(now.getDate() - mondayOffset);
        startWeek.setHours(0, 0, 0, 0);
        const endWeek = new Date(startWeek);
        endWeek.setDate(startWeek.getDate() + 7);
        const weekPercent = ((now - startWeek) / (endWeek - startWeek)) * 100;
        updateProgress(3, weekPercent);

        // 4. 公历月度进度
        const startMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
        const endMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0, 0);
        const monthPercent = ((now - startMonth) / (endMonth - startMonth)) * 100;
        updateProgress(4, monthPercent);

        // 5. 本季度进度
        const quarter = Math.floor(now.getMonth() / 3);
        const startQuarter = new Date(now.getFullYear(), quarter * 3, 1, 0, 0, 0, 0);
        const endQuarter = new Date(now.getFullYear(), quarter * 3 + 3, 1, 0, 0, 0, 0);
        const quarterPercent = ((now - startQuarter) / (endQuarter - startQuarter)) * 100;
        updateProgress(5, quarterPercent);

        // 6. 公历年度进度
        const startYear = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
        const endYear = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0, 0);
        const yearPercent = ((now - startYear) / (endYear - startYear)) * 100;
        updateProgress(6, yearPercent);

        // 7. 世纪进度 (优雅精确)
        const centuryPercent = calculateCenturyProgress(now);
        updateProgress(7, centuryPercent);
    }

    // 页面启动与实时刷新
    window.onload = () => {
        updateAllProgress();
        // 首次加载动画锁，延迟约1.2秒后关闭“首次动画模式”，后续更新直接无延迟变化
        setTimeout(() => {
            firstRender = false;
        }, 1300);
        // 每秒自动更新所有进度条 (保持实时)
        setInterval(updateAllProgress, 1000);
    };
</script>
</body>
</html>
